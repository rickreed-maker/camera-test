<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Camera test</title><style>body{background:#10151d;color:#eee;font:16px system-ui;margin:16px}button,select{font:inherit;padding:12px;margin:4px;background:#263546;color:white;border:1px solid #64748b;border-radius:8px}canvas{width:100%;max-width:800px;background:#000;border-radius:8px}video{display:none}p{overflow-wrap:anywhere}</style></head><body><h2>Camera pixel test</h2><select id="facing"><option value="environment">Rear camera</option><option value="user">Front camera</option></select><button id="start">Start camera</button><button id="stop">Stop</button><p id="status">Ready</p><video id="video" autoplay muted playsinline></video><canvas id="canvas" width="640" height="480"></canvas><p id="pixel">Tap the image to inspect a pixel.</p><script>
const video=document.querySelector('#video'),canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),status=document.querySelector('#status');let stream,raf=0,token=0,frames=0,last=0,fps=0;function stop(){token++;cancelAnimationFrame(raf);stream?.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;status.textContent='Stopped';}async function start(){stop();const id=token;try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Camera API unavailable. Open this page over HTTPS in Chrome.');status.textContent='Requesting camera permission…';const s=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:document.querySelector('#facing').value},width:{ideal:640},height:{ideal:480}}});if(id!==token){s.getTracks().forEach(t=>t.stop());return;}stream=s;video.srcObject=s;await video.play();if(id!==token)return;frames=0;last=performance.now();fps=0;let previous=-1;function draw(now){if(id!==token)return;if(video.readyState>=2&&video.videoWidth&&video.currentTime!==previous){previous=video.currentTime;if(canvas.width!==video.videoWidth||canvas.height!==video.videoHeight){canvas.width=video.videoWidth;canvas.height=video.videoHeight;}ctx.drawImage(video,0,0);frames++;}if(now-last>=1000){fps=frames*1000/(now-last);frames=0;last=now;status.textContent=`${canvas.width} × ${canvas.height} | ${fps.toFixed(1)} sampled FPS`; }raf=requestAnimationFrame(draw);}raf=requestAnimationFrame(draw);}catch(e){if(id===token){stop();status.textContent=e.name+': '+e.message;}}}document.querySelector('#start').onclick=start;document.querySelector('#stop').onclick=stop;document.querySelector('#facing').onchange=()=>{if(stream)start();};canvas.onclick=e=>{const r=canvas.getBoundingClientRect(),x=Math.min(canvas.width-1,Math.max(0,Math.floor((e.clientX-r.left)*canvas.width/r.width))),y=Math.min(canvas.height-1,Math.max(0,Math.floor((e.clientY-r.top)*canvas.height/r.height))),p=ctx.getImageData(x,y,1,1).data;document.querySelector('#pixel').textContent=`Pixel (${x}, ${y}): R ${p[0]}, G ${p[1]}, B ${p[2]} | brightness ${((.2126*p[0]+.7152*p[1]+.0722*p[2])/255).toFixed(3)}`;};window.addEventListener('pagehide',stop);
</script></body></html>
